                style: attract_mode_final_score_display_player_number
                y: bottom+50
                x: left+50
              - type: Text
                text: PLAYER 4
                style: attract_mode_final_score_display_player_number
                y: bottom+50
                x: right-500
              - type: Text
                text: (machine|player1_score)
                style: attract_mode_final_score_display_score
                y: top-50
                x: left+300
              - type: Text
                text: (machine|player2_score)
                style: attract_mode_final_score_display_score
                y: top-50
                x: right-250
              - type: Text
                text: (machine|player3_score)
                style: attract_mode_final_score_display_score
