                style: attract_mode_final_score_display_score
                y: bottom+50
                x: right-250
    - time: "+5"
      slides:
          show_high_scores:
              widgets:
              - type: Text
                text: HIGH SCORES
                font_size: 80
                bold: true
                anchor_x: center
                anchor_y: center
                x: left+20%
                y: center
              - type: Text
                text: (machine|score1_label)
                style: attract_mode_high_score_display_label
                y: top-60
              - type: Text
                text: (machine|score1_name)
                style: attract_mode_high_score_display_name
                y: top-60
              - type: Text
                text: (machine|score1_value)
                style: attract_mode_high_score_display_score
                y: top-60
              - type: Text
                text: (machine|score2_label)
                style: attract_mode_high_score_display_label
                y: top-130
              - type: Text
                text: (machine|score2_name)
                style: attract_mode_high_score_display_name
                y: top-130
              - type: Text
                text: (machine|score2_value)
                style: attract_mode_high_score_display_score
                y: top-130
              - type: Text
                text: (machine|score3_label)
                style: attract_mode_high_score_display_label
